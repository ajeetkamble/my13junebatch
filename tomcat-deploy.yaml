apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp1
  namespace: mytg
spec:
  replicas: 5
  selector:
    matchLabels:
     env: stage
  template:
    metadata:
     labels:
       env: stage
    spec:
     imagePullSecrets:
       - name: pat-dockerhub
     containers:
       - name: tomcat
         image:  ajeetkamble/tgdevops13june:pname-buildnum
         ports:
          - containerPort: 8080

